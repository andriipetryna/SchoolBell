# Збирає SchoolBell-Setup.exe на GitHub (Windows-сервер).
# Запуск: вкладка Actions → «Build installer» → Run workflow,
# або автоматично при push тегу v* (наприклад v1.0.1) — тоді інсталятор додається до Release.
name: Build installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: SchoolBell-Setup
          path: dist/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
